<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" role="img" aria-labelledby="title description">
  <title id="title">STATOMERA</title>
  <desc id="description">The STATOMERA horizontal logo featuring the Champagne Gold distribution curve and Electric Graphite identity.</desc>
  <!-- Symbol Icon Tile -->
  <g transform="translate(4, 6)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#151922" stroke="#39414E"/>
    <g transform="translate(1.4, 6.2) scale(0.097)">
      
    <!-- Main Distribution Curve Ribbon -->
    <path d="M 24 116
             C 65 116, 95 109, 118 78
             C 133 57, 142 22, 150 22
             C 158 22, 167 57, 182 78
             C 205 109, 235 116, 276 116
             C 242 115, 218 105, 196 80
             C 180 61, 168 35, 150 35
             C 132 35, 120 61, 104 80
             C 82 105, 58 115, 24 116 Z"
          fill="#D6B36A"/>
    <!-- Upper Crest Ribbon Highlight -->
    <path d="M 124 70
             C 136 53, 143 22, 150 22
             C 157 22, 164 53, 176 70
             C 169 57, 160 30, 150 30
             C 140 30, 131 57, 124 70 Z"
          fill="#E4C98F" opacity="0.9"/>
    <!-- Center Statistical Pillar (Median/Mean) -->
    <path d="M 150 48
             C 152.8 54, 152.8 106, 150 112
             C 147.2 106, 147.2 54, 150 48 Z"
          fill="#D6B36A"/>
    <!-- Left Statistical Pillar (-1 Std Dev) -->
    <path d="M 124 68
             C 126.4 72, 126.4 107, 124 112
             C 121.6 107, 121.6 72, 124 68 Z"
          fill="#AEB4BF"/>
    <!-- Right Statistical Pillar (+1 Std Dev) -->
    <path d="M 176 68
             C 178.4 72, 178.4 107, 176 112
             C 173.6 107, 173.6 72, 176 68 Z"
          fill="#AEB4BF"/>
    </g>
  </g>
  <!-- Wordmark STATOMERA -->
  <text x="46" y="24"
        fill="#F3F0E8"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16.5"
        font-weight="700"
        letter-spacing="0.18em">STATOMERA</text>
  <!-- Secondary Descriptor -->
  <text x="46.5" y="34.5"
        fill="#AEB4BF"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="7.6"
        font-weight="450"
        letter-spacing="0.08em">Statistical Data Intelligence</text>
</svg>